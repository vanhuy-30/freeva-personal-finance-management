services:
  postgres:
    image: postgres:16-alpine
    container_name: freeva-postgres
    environment:
      POSTGRES_USER: freeva
      POSTGRES_PASSWORD: freeva
      POSTGRES_DB: freeva
    ports:
      # Host 5434: máy local thường đã chạy PostgreSQL :5432
      - "5434:5432"
    volumes:
      - freeva_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freeva -d freeva"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: freeva-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: freeva-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  freeva_pg:
