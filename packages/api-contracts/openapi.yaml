                type: object
    AuthEmailRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email: &id001
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased before lookup/storage.
    AuthEmailStepResponse:
      type: object
      additionalProperties: false
      required:
      - nextStep
      properties:
        nextStep:
          type: string
          enum:
          - login
          - register
    AuthCredentialsRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email: *id001
        password: &id003
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Not trimmed or normalized. Login accepts any 12–128 characters, so passwords set before
            the letter-and-digit rule still work.
    AuthRegisterRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - termsAccepted
      properties:
        email: *id001
        password: &id004
          type: string
          minLength: 12
          maxLength: 128
          pattern: ^(?=[\s\S]*\p{L})(?=[\s\S]*\p{Nd})[\s\S]*$
          writeOnly: true
          description: Not trimmed or normalized. A new password needs at least one letter and one digit, in any
            script (DS-P2-004); symbols are optional. Otherwise 400 VALIDATION_ERROR.
        termsAccepted:
          type: boolean
          enum:
          - true
          description: The person ticked the Terms and Privacy policy checkbox. The server records the time and the
            policy version on the user. Otherwise 400 VALIDATION_ERROR.
    AuthTokenRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token: &id002
          type: string
          pattern: ^[a-f0-9]{64}$
          writeOnly: true
    AuthResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - token
      - password
      properties:
        token: *id002
        password: *id004
    AuthAccepted:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          const: If the account is eligible, an email will be sent.
    AuthLoginResponse:
      type: object
      additionalProperties: false
