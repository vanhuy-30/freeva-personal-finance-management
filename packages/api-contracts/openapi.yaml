components:
  headers:
    FinancialAccountNoStore:
      description: Financial responses must not be cached.
      schema:
        type: string
        const: no-store
  responses:
    FinancialAccountValidationError:
      description: VALIDATION_ERROR
      headers:
        Cache-Control:
          $ref: '#/components/headers/FinancialAccountNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    FinancialAccountUnauthorized:
      description: SESSION_INVALID
      headers:
        Cache-Control:
          $ref: '#/components/headers/FinancialAccountNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    FinancialAccountConflict:
      description: 'ACCOUNT_CONFLICT: stale version, duplicate clientId with different
        fields, or immutable history fields'
      headers:
        Cache-Control:
          $ref: '#/components/headers/FinancialAccountNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    FinancialAccountUnavailable:
      description: ACCOUNTS_UNAVAILABLE or authentication unavailable
      headers:
        Cache-Control:
          $ref: '#/components/headers/FinancialAccountNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    FinancialAccountNotFound:
      description: 'ACCOUNT_NOT_FOUND: missing or owned by another user'
      headers:
        Cache-Control:
          $ref: '#/components/headers/FinancialAccountNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    StaffBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 256-bit token returned once on login; absolute 7-day expiry. Server
        checks session storage on every authenticated request. No refresh token in this
        phase.
  schemas:
    TransactionLegInput:
      type: object
      additionalProperties: false
      required:
      - clientId
      - accountId
      - currencyCode
      - amountMinor
      properties:
        clientId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        currencyCode:
          type: string
          pattern: ^[A-Z]{3}$
        amountMinor:
          type: string
          maxLength: 20
          pattern: ^-?[0-9]+$
          description: Signed int64 integer minor units. Income positive; expense negative; transfer source negative and destination
            positive. Zero is rejected.
    ManualTransactionFx:
      type: object
      additionalProperties: false
      required:
      - rate
      - quotedAt
      properties:
        rate:
          type: string
          pattern: ^\d{1,10}(\.\d{1,8})?$
          description: Positive Decimal(18,8); exact conversion only, fractional destination minor units rejected.
        quotedAt:
          type: string
          format: date-time
    CreateTransaction:
      type: object
      additionalProperties: false
      required:
      - type
      - occurredOn
      - legs
      properties:
        type:
          type: string
          enum:
          - income
          - expense
          - transfer
        occurredOn:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        legs:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/TransactionLegInput'
          description: One leg for income/expense; exactly two ordered source, destination for transfer. Distinct accounts and
            clientIds. PATCH replaces both legs and preserves their clientIds/order.
        categoryId:
          type:
          - string
          - 'null'
          format: uuid
          description: Required and non-null for expense, optional for income, must be null/omitted for transfer. Active category
            owned by the session user.
        notes:
          type:
          - string
          - 'null'
          maxLength: 2000
        tagIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        fx:
          oneOf:
          - $ref: '#/components/schemas/ManualTransactionFx'
          - type: 'null'
          description: Required for different currencies; forbidden otherwise. Stored immutable with both legs pointing to the
            same quote.
    UpdateTransaction:
      type: object
      additionalProperties: false
      required:
      - version
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 2147483646
        occurredOn:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        legs:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/TransactionLegInput'
          description: One leg for income/expense; exactly two ordered source, destination for transfer. Distinct accounts and
            clientIds. PATCH replaces both legs and preserves their clientIds/order.
        categoryId:
          type:
          - string
          - 'null'
          format: uuid
          description: Required and non-null for expense, optional for income, must be null/omitted for transfer. Active category
            owned by the session user.
        notes:
          type:
          - string
          - 'null'
          maxLength: 2000
        tagIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        fx:
          oneOf:
          - $ref: '#/components/schemas/ManualTransactionFx'
          - type: 'null'
          description: Required for different currencies; forbidden otherwise. Stored immutable with both legs pointing to the
            same quote.
        deleted:
          type: boolean
          description: Soft-delete or restore the entire transfer pair. Other omitted fields retain their values; type and clientIds
            are immutable.
    TransactionLeg:
      type: object
      additionalProperties: false
      required:
      - clientId
      - accountId
      - currencyCode
      - amountMinor
      - id
      - type
      - occurredOn
      - categoryId
      - notes
      - tagIds
      - transferGroupId
      - fxQuoteId
      - deletedAt
      - version
      - createdAt
      - updatedAt
      properties:
        clientId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        currencyCode:
          type: string
          pattern: ^[A-Z]{3}$
        amountMinor:
          type: string
          maxLength: 20
          pattern: ^-?[0-9]+$
          description: Signed int64 integer minor units. Income positive; expense negative; transfer source negative and destination
            positive. Zero is rejected.
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - income
          - expense
          - transfer
        occurredOn:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        categoryId:
          type:
          - string
          - 'null'
          format: uuid
        notes:
          type:
          - string
          - 'null'
        tagIds:
          type: array
          items:
            type: string
            format: uuid
        transferGroupId:
          type:
          - string
          - 'null'
          format: uuid
        fxQuoteId:
          type:
          - string
          - 'null'
          format: uuid
        deletedAt:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TransactionBundle:
      type: object
      additionalProperties: false
      required:
      - legs
      - fx
      properties:
        legs:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/TransactionLeg'
        fx:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - id
            - fromCode
            - toCode
            - rate
            - quotedAt
            properties:
              id:
                type: string
                format: uuid
              fromCode:
                type: string
              toCode:
                type: string
              rate:
                type: string
              quotedAt:
                type: string
                format: date-time
          - type: 'null'
    TransactionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionLeg'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          description: Count of legs, including both sides of transfers when both match filters.
    CreateFinancialAccount:
      type: object
      additionalProperties: false
      required:
      - clientId
      - name
      - type
      - currencyCode
      - initialBalanceMinor
      properties:
        clientId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed before validation and storage.
        type:
          type: string
          enum:
          - cash
          - bank
          - ewallet
          - credit
        currencyCode:
          type: string
          pattern: ^[A-Z]{3}(?![\s\S])
          description: Existing currency catalog code.
        initialBalanceMinor:
          type: string
          pattern: ^-?[0-9]+(?![\s\S])
          maxLength: 20
          description: Integer minor units in signed int64 range (-9223372036854775808..9223372036854775807).
        sortOrder:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
        creditLimitMinor:
          type:
          - string
          - 'null'
          pattern: ^-?[0-9]+(?![\s\S])
          maxLength: 20
          description: Nonnegative integer minor units, at most 9223372036854775807. Only
            for credit accounts.
        statementCloseDay:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 28
        paymentDueDay:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 28
      description: Card fields must be null or omitted for non-credit accounts. Omitted
        card fields default to null. clientId is unique per owner; identical normalized
        retries return the existing account, including archived accounts; differing fields
        return 409. Retries compare against current stored fields, not a historical creation
        payload.
    UpdateFinancialAccount:
      type: object
      additionalProperties: false
      required:
      - version
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 2147483646
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed before validation and storage.
        type:
          type: string
          enum:
