          - ewallet
          - credit
        currencyCode:
          type: string
          pattern: ^[A-Z]{3}(?![\s\S])
          description: Existing currency catalog code.
        initialBalanceMinor:
          type: string
          pattern: ^-?[0-9]+(?![\s\S])
          maxLength: 20
          description: Integer minor units in signed int64 range (-9223372036854775808..9223372036854775807).
        sortOrder:
          type: integer
          minimum: 0
          maximum: 2147483647
        creditLimitMinor:
          type:
          - string
          - 'null'
          pattern: ^-?[0-9]+(?![\s\S])
          maxLength: 20
          description: Nonnegative integer minor units, at most 9223372036854775807. Only
            for credit accounts.
        statementCloseDay:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 28
        paymentDueDay:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 28
        archived:
          type: boolean
      description: Partial update. Omitted fields are preserved; null is allowed only
        for card fields. Type and currency cannot change after any transaction, including
        deleted ones. Initial balance remains editable. Changing away from credit clears
        card fields; supplying non-null card fields then is invalid. Successful writes
        increment version, including no-op writes. archived false restores an account.
    FinancialAccount:
      type: object
      additionalProperties: false
      required:
      - id
      - clientId
      - name
      - type
      - currencyCode
      - initialBalanceMinor
      - sortOrder
      - creditLimitMinor
      - statementCloseDay
      - paymentDueDay
      - balanceMinor
      - version
      - archivedAt
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed before validation and storage.
        type:
          type: string
          enum:
