    AuthTokenRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token: &id002
          type: string
          pattern: ^[a-f0-9]{64}$
          writeOnly: true
    AuthResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - token
      - password
      properties:
        token: *id002
        password: *id003
    AuthAccepted:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
