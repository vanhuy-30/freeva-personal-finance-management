            - from
            - to
            - totals
            properties:
              from:
                type: string
                format: date
              to:
                type: string
                format: date
              totals:
                type: array
                description: Currencies with activity in the bucket, sorted by code.
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - currency
                  - incomeMinor
                  - expenseMinor
                  properties:
                    currency:
                      type: string
                      pattern: ^[A-Z]{3}$
                    incomeMinor:
                      $ref: '#/components/schemas/ReportMoney'
                    expenseMinor:
                      $ref: '#/components/schemas/ReportMoney'
    CashflowPeriod:
      type: object
      additionalProperties: false
      required:
      - kind
      - from
      - to
      - timezone
      - fiscalMonthStartDay
      properties:
        kind:
          type: string
          enum:
          - week
          - month
          - year
          - range
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timezone:
          type: string
        fiscalMonthStartDay:
          type: integer
          minimum: 1
          maximum: 28
    CashflowTotal:
      type: object
      additionalProperties: false
      required:
      - currency
      - incomeMinor
      - expenseMinor
      - netMinor
      - savingsRateBps
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        incomeMinor:
          $ref: '#/components/schemas/ReportMoney'
        expenseMinor:
          $ref: '#/components/schemas/ReportMoney'
        netMinor:
          $ref: '#/components/schemas/ReportMoney'
          description: incomeMinor + expenseMinor. Transfers are excluded. This is savings for the period.
        savingsRateBps:
          type:
          - integer
          - 'null'
          description: netMinor * 10000 / incomeMinor when incomeMinor > 0; otherwise null. 3933 means 39.33%.
    MonthReviewReport:
      type: object
      additionalProperties: false
      required:
      - period
      - currencies
      properties:
        period:
          type: object
          additionalProperties: false
          required:
          - kind
          - from
          - to
          - timezone
          - fiscalMonthStartDay
          properties:
            kind:
              type: string
              enum:
              - month
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            timezone:
              type: string
            fiscalMonthStartDay:
              type: integer
              minimum: 1
              maximum: 28
        currencies:
          type: array
          description: Currencies with income or expense in the month, sorted by code. Amounts match cashflow totals for the same period.
          items:
            $ref: '#/components/schemas/MonthReviewCurrency'
    MonthReviewCurrency:
      type: object
      additionalProperties: false
      required:
      - currency
      - incomeMinor
      - expenseMinor
      - savingsMinor
      - savingsRateBps
      - topCategories
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        incomeMinor:
          $ref: '#/components/schemas/ReportMoney'
        expenseMinor:
          $ref: '#/components/schemas/ReportMoney'
        savingsMinor:
          $ref: '#/components/schemas/ReportMoney'
          description: Same as cashflow netMinor for the month (income + expense). Transfers excluded.
        savingsRateBps:
          type:
          - integer
          - 'null'
          description: Same as cashflow savingsRateBps. 3933 means 39.33%. Null when income is not positive.
        topCategories:
          type: array
          maxItems: 3
          description: Up to 3 leaf expense categories by |expense| descending, then categoryId (null last).
          items:
            $ref: '#/components/schemas/MonthReviewCategory'
    MonthReviewCategory:
      type: object
      additionalProperties: false
      required:
      - categoryId
      - parentId
      - expenseMinor
      - transactionCount
      properties:
        categoryId:
          type:
          - string
          - 'null'
          format: uuid
        parentId:
          type:
          - string
          - 'null'
          format: uuid
        expenseMinor:
          $ref: '#/components/schemas/ReportMoney'
        transactionCount:
          type: integer
          minimum: 1
    CashflowComparison:
      type: object
      additionalProperties: false
      required:
      - from
      - to
      - totals
      - expenseDeltaBps
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totals:
          type: array
          description: Cashflow totals for the adjacent previous period.
          items:
            $ref: '#/components/schemas/CashflowTotal'
        expenseDeltaBps:
          type: array
          description: Per-currency change in |expense| versus the previous period. Currencies present in either period are included. Null delta when previous expense is zero.
          items:
            type: object
            additionalProperties: false
            required:
            - currency
            - deltaBps
            properties:
              currency:
                type: string
                pattern: ^[A-Z]{3}$
              deltaBps:
                type:
                - integer
                - 'null'
                description: (|current| - |previous|) * 10000 / |previous|. Positive means more spent.
    CashflowMerchantTotal:
      type: object
      additionalProperties: false
