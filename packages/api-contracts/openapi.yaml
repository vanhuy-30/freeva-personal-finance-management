  /api/v1/account/export:
    get:
      operationId: exportAccount
      tags: [Account]
      summary: Export the signed-in user's data as JSON
      description: Bearer session only. Includes owned profile, wallets, categories, tags, FX quotes and transactions, including soft-deleted transactions. Omits password hashes, sessions, tokens and OAuth subjects. Writes audit user.data_export in the same transaction and returns nothing if that write fails. Requires SchemaMeta. Cache-Control no-store. Does not log the body, email, notes or amounts.
      security:
      - UserBearer: []
      responses:
        '200':
          description: Account snapshot (Cache-Control no-store)
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '401':
          description: Missing, expired or revoked session
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Storage unavailable, audit write failed, or SchemaMeta is missing
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/account:
    delete:
      operationId: deleteAccount
      tags: [Account]
      summary: Permanently delete the signed-in account
      description: Bearer session only. Deletes owned financial data and the user row in one transaction, then cascades auth sessions, tokens, mail jobs and OAuth identities. Writes audit user.account_delete before the user row is removed. Audit rows are kept. Does not require SchemaMeta and does not apply a grace period. Cache-Control no-store. Does not log email, notes or amounts.
      security:
      - UserBearer: []
      responses:
        '204':
          description: Account deleted (Cache-Control no-store)
          headers:
