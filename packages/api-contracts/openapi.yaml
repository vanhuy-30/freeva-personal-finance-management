        spentMinor:
          $ref: '#/components/schemas/ReportMoney'
        remainingMinor:
          $ref: '#/components/schemas/ReportMoney'
        percentBps:
          type: integer
          description: spent * 10000 / limit (7000 = 70.00%).
        status:
          $ref: '#/components/schemas/BudgetStatus'
    BudgetSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - currencyCode
      - limitMinor
      - spentMinor
      - remainingMinor
      - percentBps
      - status
