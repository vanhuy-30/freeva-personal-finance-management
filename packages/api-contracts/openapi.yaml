openapi: 3.1.0
info:
  title: Freeva API
  version: 0.1.0
  description: Source of truth for mobile and web admin.
servers:
  - url: http://localhost:4000
    description: local
paths:
  /api/health:
    get:
      security: []
      operationId: getHealth
      tags: [Health]
      summary: Liveness and database check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/user-lookups:
    post:
      operationId: lookupUserAccountForStaff
      tags: [Admin]
      summary: Look up one user account by exact ID or email
      description: Staff-only lookup. Every completed lookup attempt is audited before PII is returned.
      security:
        - StaffBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserLookupRequest'
      responses:
        '200':
          description: Minimum account profile for support lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUserLookupResponse'
        '400':
          description: Invalid or ambiguous lookup criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid staff credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No user matches the exact lookup criterion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Staff auth or audit storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/email-step:
    post:
      operationId: emailStep
      tags:
      - Auth
      summary: Choose login or registration for the email-first mobile flow
      description: Intentionally reveals whether an email is registered. Returns only
        the next step, including login for legacy accounts without a password.
        Rate limited per IP/email; no account details and no credential mutation.
      security: []
      responses:
        '200':
          description: Next step; response must not be cached
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEmailStepResponse'
        '400':
          description: Invalid email or request body. Validation errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailRequest'
  /api/v1/auth/register:
    post:
      operationId: register
      tags:
      - Auth
      summary: Register email/password; duplicate email returns the same response without
        changing credentials
      security: []
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthAccepted'
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentialsRequest'
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Login with email and password; email verification is optional
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing/expired/revoked session, or incorrect credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentialsRequest'
  /api/v1/auth/email-verifications:
    post:
      operationId: requestEmailVerification
      tags:
      - Auth
      summary: Request/retry verification email (24-hour single-use token); replaces
        previous token
      security: []
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthAccepted'
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailRequest'
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags:
      - Auth
      summary: Consume email verification token; does not create a session
      security: []
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
  /api/v1/auth/password-resets:
    post:
      operationId: requestPasswordReset
      tags:
      - Auth
      summary: Request reset email (30-minute single-use token); same response for unknown
        accounts
      security: []
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthAccepted'
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailRequest'
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags:
      - Auth
      summary: Reset password and atomically revoke all sessions and outstanding email
        tokens; does not verify email or auto-login
      security: []
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResetPasswordRequest'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: Revoke current session
      security:
      - UserBearer: []
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing/expired/revoked session, or incorrect credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sessions:
    get:
      operationId: listSessions
      tags:
      - Auth
      summary: List own active sessions, newest first
      security:
      - UserBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionsResponse'
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing/expired/revoked session, or incorrect credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: revokeAllSessions
      tags:
      - Auth
      summary: Revoke all own sessions, including current session
      security:
      - UserBearer: []
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing/expired/revoked session, or incorrect credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags:
      - Auth
      summary: Revoke own session; idempotent 204 also for missing or foreign session
        IDs
      security:
      - UserBearer: []
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing/expired/revoked session, or incorrect credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
          description: UUID v4
components:
  securitySchemes:
    StaffBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 256-bit token returned once on login; absolute 7-day expiry. Server
        checks session storage on every authenticated request. No refresh token in this
        phase.
  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: freeva-api
        timestamp:
          type: string
          format: date-time
        database:
          type: string
          enum: [up, down]
    StaffUserLookupRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [userId]
          properties:
            userId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required: [email]
          properties:
            email:
              type: string
              format: email
    StaffUserLookupResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - locale
        - timezone
        - defaultCurrencyCode
        - fiscalMonthStartDay
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        locale:
          type: string
          example: vi
        timezone:
          type: string
          example: Asia/Ho_Chi_Minh
        defaultCurrencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: VND
        fiscalMonthStartDay:
          type: integer
          minimum: 1
          maximum: 28
        createdAt:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
    AuthEmailRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email: &id001
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased before lookup/storage.
    AuthEmailStepResponse:
      type: object
      additionalProperties: false
      required:
      - nextStep
      properties:
        nextStep:
          type: string
          enum:
          - login
          - register
    AuthCredentialsRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email: *id001
        password: &id003
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Not trimmed or normalized.
    AuthTokenRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token: &id002
          type: string
          pattern: ^[a-f0-9]{64}$
          writeOnly: true
    AuthResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - token
      - password
      properties:
        token: *id002
        password: *id003
    AuthAccepted:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          const: If the account is eligible, an email will be sent.
    AuthLoginResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - expiresAt
      - sessionId
      properties:
        accessToken:
          type: string
          pattern: ^[a-f0-9]{64}$
        tokenType:
          type: string
          enum:
          - Bearer
        expiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
    AuthSession:
      type: object
      additionalProperties: false
      required:
      - id
      - createdAt
      - expiresAt
      - current
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
    AuthSessionsResponse:
      type: object
      additionalProperties: false
      required:
      - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AuthSession'
