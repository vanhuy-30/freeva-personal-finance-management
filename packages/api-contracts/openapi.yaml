          headers:
            Cache-Control:
              $ref: '#/components/headers/ReportNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthReviewReport'
        '400':
          $ref: '#/components/responses/ReportValidationError'
        '401':
          $ref: '#/components/responses/ReportUnauthorized'
        '503':
          $ref: '#/components/responses/ReportUnavailable'
      description: Read-only projection of monthly cashflow. Period follows fiscalMonthStartDay. Amounts and savingsRateBps match GET /reports/cashflow for the same month. savingsMinor equals netMinor. topCategories are leaf expense rows by |expense| descending (ties by categoryId, null last), max 3 per currency. Category names are not returned. Transfers excluded. No FX conversion. No AI narrative.
