          type: array
          items:
            $ref: '#/components/schemas/AuthSession'
    ReportMoney:
      type: string
      pattern: ^-?[0-9]+$
      description: Signed integer minor units as a decimal string. May exceed int64. Never a JSON number.
    CashflowReport:
      type: object
      additionalProperties: false
      required:
      - period
      - totals
      - byCategory
      - byAccount
      - comparison
      - topMerchants
