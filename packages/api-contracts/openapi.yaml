          - active
          - deleted
          - all
          default: active
      - in: query
        name: currency
        required: false
        description: ISO 4217 code of the transaction currency.
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - in: query
        name: sort
        required: false
        description: date is newest first (default). amountDesc is the largest amount first, ignoring sign.
        schema:
          type: string
          enum:
          - date
          - amountDesc
          default: date
      - in: query
        name: accountId
        style: form
        explode: true
        schema:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        description: Repeat to match any of several wallets (per leg). A single value still works.
      - in: query
        name: categoryId
        style: form
        explode: true
        schema:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        description: Repeat to match any of several categories. The client expands a parent to its children.
      - in: query
        name: tagId
        style: form
        explode: true
        schema:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        description: Repeat to match transactions carrying any of these tags.
      - in: query
