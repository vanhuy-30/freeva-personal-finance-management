openapi: 3.1.0
info:
  title: Freeva API
  version: 0.1.0
  description: Source of truth for mobile and web admin.
servers:
  - url: http://localhost:4000
    description: local
paths:
  /api/v1/transactions:
    post:
      operationId: createTransaction
      summary: Create income, expense, or an atomic balanced transfer
      tags:
      - Transactions
      security:
      - UserBearer: []
      responses:
        '201':
          description: Created
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionBundle'
        '200':
          description: Normalized clientId replay matches current data, including deleted records; no restoration
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionBundle'
        '400':
          description: VALIDATION_ERROR
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: SESSION_INVALID or auth error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: TRANSACTION_NOT_FOUND or ACCOUNT_NOT_FOUND (also for another owner)
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'TRANSACTION_CONFLICT: stale version, archived wallet, or conflicting clientId replay'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: TRANSACTIONS_UNAVAILABLE
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransaction'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
        description: Must equal the first leg clientId (case-insensitive); retry uses the same key and all leg clientIds.
    get:
      operationId: listTransactions
      summary: List own transaction legs with pagination and filters
      tags:
      - Transactions
      security:
      - UserBearer: []
      responses:
        '200':
          description: Ordered occurredOn descending, createdAt descending, id ascending
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          description: VALIDATION_ERROR
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: SESSION_INVALID or auth error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: TRANSACTION_NOT_FOUND or ACCOUNT_NOT_FOUND (also for another owner)
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'TRANSACTION_CONFLICT: stale version, archived wallet, or conflicting clientId replay'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: TRANSACTIONS_UNAVAILABLE
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - deleted
          - all
          default: active
      - in: query
        name: accountId
        schema:
          type: string
          format: uuid
      - in: query
        name: categoryId
        schema:
          type: string
          format: uuid
      - in: query
        name: type
        schema:
          type: string
          enum:
          - income
          - expense
          - transfer
      - in: query
        name: from
        schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
      - in: query
        name: to
        schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
      - in: query
        name: search
        schema:
          type: string
          maxLength: 200
          description: Case-insensitive substring of notes.
  /api/v1/transactions/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Either leg ID addresses the entire transfer pair.
    get:
      operationId: getTransaction
      summary: Read one transaction or both transfer legs, including deleted
      tags:
      - Transactions
      security:
      - UserBearer: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionBundle'
        '400':
          description: VALIDATION_ERROR
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: SESSION_INVALID or auth error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: TRANSACTION_NOT_FOUND or ACCOUNT_NOT_FOUND (also for another owner)
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'TRANSACTION_CONFLICT: stale version, archived wallet, or conflicting clientId replay'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: TRANSACTIONS_UNAVAILABLE
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateTransaction
      summary: Atomically edit, soft-delete, or restore transaction and linked leg
      tags:
      - Transactions
      security:
      - UserBearer: []
      responses:
        '200':
          description: Both leg versions increment together
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionBundle'
        '400':
          description: VALIDATION_ERROR
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: SESSION_INVALID or auth error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: TRANSACTION_NOT_FOUND or ACCOUNT_NOT_FOUND (also for another owner)
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'TRANSACTION_CONFLICT: stale version, archived wallet, or conflicting clientId replay'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: TRANSACTIONS_UNAVAILABLE
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransaction'
    delete:
      operationId: deleteTransaction
      summary: Soft-delete transaction and linked transfer leg atomically
      tags:
      - Transactions
      security:
      - UserBearer: []
      responses:
        '204':
          description: Deleted
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
        '400':
          description: VALIDATION_ERROR
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: SESSION_INVALID or auth error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: TRANSACTION_NOT_FOUND or ACCOUNT_NOT_FOUND (also for another owner)
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'TRANSACTION_CONFLICT: stale version, archived wallet, or conflicting clientId replay'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: TRANSACTIONS_UNAVAILABLE
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - in: query
        name: version
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483646
  /api/v1/financial-accounts:
    post:
      operationId: createFinancialAccount
      summary: Create a financial account
      tags:
      - FinancialAccounts
      security:
      - UserBearer: []
      responses:
        '201':
          description: Created
          headers:
            Cache-Control:
              $ref: '#/components/headers/FinancialAccountNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialAccount'
        '200':
          description: Idempotent replay
          headers:
            Cache-Control:
              $ref: '#/components/headers/FinancialAccountNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialAccount'
        '400':
          $ref: '#/components/responses/FinancialAccountValidationError'
        '401':
          $ref: '#/components/responses/FinancialAccountUnauthorized'
        '409':
          $ref: '#/components/responses/FinancialAccountConflict'
        '503':
          $ref: '#/components/responses/FinancialAccountUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFinancialAccount'
    get:
      operationId: listFinancialAccounts
      summary: List own financial accounts
      tags:
      - FinancialAccounts
      security:
      - UserBearer: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              $ref: '#/components/headers/FinancialAccountNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialAccountPage'
        '400':
          $ref: '#/components/responses/FinancialAccountValidationError'
        '401':
          $ref: '#/components/responses/FinancialAccountUnauthorized'
        '503':
          $ref: '#/components/responses/FinancialAccountUnavailable'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - archived
          - all
          default: active
      description: Ordered by sortOrder, createdAt, id ascending. Items, balances and
        total use one database snapshot.
  /api/v1/financial-accounts/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getFinancialAccount
      summary: Get own financial account, including archived
      tags:
      - FinancialAccounts
      security:
      - UserBearer: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              $ref: '#/components/headers/FinancialAccountNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialAccount'
        '400':
          $ref: '#/components/responses/FinancialAccountValidationError'
        '401':
          $ref: '#/components/responses/FinancialAccountUnauthorized'
        '404':
          $ref: '#/components/responses/FinancialAccountNotFound'
        '503':
          $ref: '#/components/responses/FinancialAccountUnavailable'
    patch:
      operationId: updateFinancialAccount
      summary: Update or restore own financial account
      tags:
      - FinancialAccounts
      security:
      - UserBearer: []
      responses:
        '200':
          description: Updated
          headers:
            Cache-Control:
              $ref: '#/components/headers/FinancialAccountNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialAccount'
        '400':
          $ref: '#/components/responses/FinancialAccountValidationError'
        '401':
          $ref: '#/components/responses/FinancialAccountUnauthorized'
        '404':
          $ref: '#/components/responses/FinancialAccountNotFound'
        '409':
          $ref: '#/components/responses/FinancialAccountConflict'
        '503':
          $ref: '#/components/responses/FinancialAccountUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFinancialAccount'
    delete:
      operationId: archiveFinancialAccount
      summary: Archive own financial account without deleting history
      tags:
      - FinancialAccounts
      security:
      - UserBearer: []
      responses:
        '204':
          description: Archived
          headers:
            Cache-Control:
              $ref: '#/components/headers/FinancialAccountNoStore'
        '400':
          $ref: '#/components/responses/FinancialAccountValidationError'
        '401':
          $ref: '#/components/responses/FinancialAccountUnauthorized'
        '404':
          $ref: '#/components/responses/FinancialAccountNotFound'
        '409':
          $ref: '#/components/responses/FinancialAccountConflict'
        '503':
          $ref: '#/components/responses/FinancialAccountUnavailable'
      parameters:
      - name: version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483646
      description: Always archives; never hard-deletes. Increments version, even if
        already archived. Existing archivedAt is preserved. Stale versions return 409.
  /api/v1/auth/oauth/challenges:
    post:
      summary: Create a provider-bound OAuth challenge
      operationId: createOAuthChallenge
      tags: [Auth]
      security: []
      description: Create a single-use 5-minute challenge. Send nonce unchanged to the provider; keep challengeToken locally until exchange.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthChallengeRequest'
      responses:
        '200':
          description: Success (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthChallengeResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid credentials or challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many attempts; 30 requests per IP per operation in 15 minutes
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Provider disabled or authentication unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/oauth/login:
    post:
      summary: Exchange a provider ID token for a Freeva session
      operationId: loginOAuth
      tags: [Auth]
      security: []
      description: Verify a Google or Apple ID token bound to the server nonce and issue an opaque 7-day session. Identity is provider plus subject. Never auto-link by email; conflicting email or missing verified email for a new identity returns generic 401. Existing identities need no email claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginRequest'
      responses:
        '200':
          description: Success (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid credentials or challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many attempts; 30 requests per IP per operation in 15 minutes
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Provider disabled or authentication unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/profile:
    get:
      operationId: getProfile
      tags: [Profile]
      security:
        - UserBearer: []
      responses:
        '200':
          description: Current profile data (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: updateProfile
      tags: [Profile]
      security:
        - UserBearer: []
      description: Update own preferences with optimistic version check. Does not convert existing monetary data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: Current profile data (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Profile changed; reload before saving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/profile/options:
    get:
      operationId: getProfileOptions
      tags: [Profile]
      security:
        - UserBearer: []
      responses:
        '200':
          description: Current profile data (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOptions'
        '401':
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/health:
    get:
      security: []
      operationId: getHealth
      tags: [Health]
      summary: Liveness and database check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/user-lookups:
    post:
      operationId: lookupUserAccountForStaff
      tags: [Admin]
      summary: Look up one user account by exact ID or email
      description: Staff-only lookup. Every completed lookup attempt is audited before PII is returned.
      security:
        - StaffBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserLookupRequest'
      responses:
        '200':
          description: Minimum account profile for support lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUserLookupResponse'
        '400':
          description: Invalid or ambiguous lookup criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid staff credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No user matches the exact lookup criterion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Staff auth or audit storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/email-step:
    post:
      operationId: emailStep
      tags:
      - Auth
      summary: Choose login or registration for the email-first mobile flow
      description: Intentionally reveals whether an email is registered. Returns only
        the next step, including login for legacy accounts without a password.
        Rate limited per IP/email; no account details and no credential mutation.
      security: []
      responses:
        '200':
          description: Next step; response must not be cached
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEmailStepResponse'
        '400':
          description: Invalid email or request body. Validation errors never echo submitted values.
          content:
            application/json:
              schema:
