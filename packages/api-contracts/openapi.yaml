      - UserBearer: []
      responses:
        '200':
          description: Saved budget with spend for the relevant fiscal month
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetSummary'
        '400':
          $ref: '#/components/responses/BudgetValidationError'
        '401':
          $ref: '#/components/responses/BudgetUnauthorized'
        '409':
          $ref: '#/components/responses/BudgetConflict'
        '503':
          $ref: '#/components/responses/BudgetUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutBudgetRequest'
      description: Currency is always the profile default currency. `applyTo=default`
        (omit for the same) updates the template for every month without an override.
        `applyTo=month` requires `on` and upserts an override for that fiscal month only.
        Updating requires the current version of that row. Creating must omit version.
        Category lines replace the whole set. Categories must be expense or both and not
        archived. Alert thresholds default to 70, 80, 90, 100 when omitted.
    delete:
      operationId: deleteCurrentBudget
      summary: Remove the default template or a month override
      tags:
      - Budgets
      security:
      - UserBearer: []
      parameters:
      - in: query
        name: applyTo
        required: false
        schema:
          type: string
          enum: [default, month]
          default: default
        description: default removes the template; month removes the override for `on`.
      - in: query
        name: on
        required: false
        schema:
          type: string
          format: date
        description: Required when applyTo=month. Anchors the fiscal month to delete.
      - in: query
        name: version
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 2147483646
        description: When set, must match the stored version.
      responses:
        '204':
          description: Deleted
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/BudgetUnauthorized'
        '404':
          $ref: '#/components/responses/BudgetNotFound'
        '409':
          $ref: '#/components/responses/BudgetConflict'
        '503':
          $ref: '#/components/responses/BudgetUnavailable'
