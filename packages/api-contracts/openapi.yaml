          description: Integer minor units in signed int64 range (-9223372036854775808..9223372036854775807).
        sortOrder:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
        creditLimitMinor:
          type:
          - string
          - 'null'
          pattern: ^-?[0-9]+(?![\s\S])
          maxLength: 20
          description: Nonnegative integer minor units, at most 9223372036854775807. Only
            for credit accounts.
        statementCloseDay:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 28
        paymentDueDay:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 28
        balanceMinor:
          type: string
          pattern: ^-?[0-9]+(?![\s\S])
          description: Initial balance plus undeleted signed transactions, from one snapshot;
            may exceed int64.
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        archivedAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FinancialAccountPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FinancialAccount'
        page:
          type: integer
          minimum: 1
          maximum: 2147483647
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    OAuthChallengeRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          enum: [google, apple]
    OAuthChallengeResponse:
      type: object
      additionalProperties: false
      required: [challengeToken, nonce, expiresAt]
      properties:
        challengeToken:
          type: string
          pattern: ^[a-f0-9]{64}$
        nonce:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 of challengeToken; pass unchanged as the provider nonce. SDKs that hash a raw nonce must receive challengeToken instead.
        expiresAt:
          type: string
          format: date-time
    OAuthLoginRequest:
      type: object
      additionalProperties: false
      required: [provider, challengeToken, idToken]
      properties:
        provider:
          type: string
          enum: [google, apple]
        challengeToken:
          type: string
          pattern: ^[a-f0-9]{64}$
        idToken:
          type: string
          minLength: 1
          maxLength: 16384
    Profile:
      type: object
      additionalProperties: false
      required: [locale, defaultCurrencyCode, timezone, fiscalMonthStartDay, version]
      properties:
        locale:
          type: string
          enum: [vi, en]
        defaultCurrencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Must exist in the currency catalog.
        timezone:
          type: string
          maxLength: 100
          description: IANA timezone or UTC; aliases accepted.
          example: Asia/Ho_Chi_Minh
        fiscalMonthStartDay:
          type: integer
          minimum: 1
          maximum: 28
        version:
          type: integer
          minimum: 1
          maximum: 2147483646
    ProfileOptions:
      type: object
      additionalProperties: false
      required: [currencies, timezones]
      properties:
        currencies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, minorDigits]
            properties:
              code:
                type: string
                pattern: '^[A-Z]{3}$'
              minorDigits:
                type: integer
                minimum: 0
        timezones:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: freeva-api
        timestamp:
          type: string
          format: date-time
        database:
          type: string
          enum: [up, down]
    StaffUserLookupRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [userId]
          properties:
            userId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required: [email]
          properties:
            email:
              type: string
              format: email
    StaffUserLookupResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - locale
        - timezone
        - defaultCurrencyCode
        - fiscalMonthStartDay
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        locale:
          type: string
          example: vi
        timezone:
          type: string
          example: Asia/Ho_Chi_Minh
        defaultCurrencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: VND
        fiscalMonthStartDay:
          type: integer
          minimum: 1
          maximum: 28
        createdAt:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
