      - in: query
        name: to
        schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
      - in: query
        name: search
        schema:
          type: string
          maxLength: 200
          description: >
            Substring of notes, merchant, the leg category name, the account name, or any tag name.
            Matching ignores case and Vietnamese diacritics. A numeric query also matches
            abs(amountMinor): grouped thousands (150.000) as exact minor units, or one
            decimal separator whose fraction is not 3 digits (12.50) scaled by the leg
            currency minor digits with no rounding. Combined with from/to and the other
            filters. Blank text does not filter.
