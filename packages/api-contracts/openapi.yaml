openapi: 3.1.0
info:
  title: Freeva API
  version: 0.1.0
  description: Source of truth for mobile and web admin.
servers:
  - url: /
    description: Origin of the deployed API. Paths already start with /api.
paths:
  /api/v1/categories/defaults:
    post:
      operationId: initializeDefaultCategories
      summary: Initialize Vietnamese default categories once
      tags:
      - Categories
      security:
      - UserBearer: []
      responses:
        '204':
          description: Initialized or already initialized
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/CategoryValidationError'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryConflict'
        '503':
          $ref: '#/components/responses/CategoryUnavailable'
      description: Creates 15 editable root categories atomically for the session owner. Concurrent/repeated calls
        are safe; deleted defaults are never recreated. Call before the first category list. Does not modify custom
        categories. GET endpoints never initialize data.
  /api/v1/categories/options:
    get:
      operationId: categoryOptions
      summary: Get supported color token names and semantic icon keys
      tags:
      - Categories
      security:
      - UserBearer: []
      responses:
        '200':
          description: Metadata catalog
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOptions'
        '400':
          $ref: '#/components/responses/CategoryValidationError'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryConflict'
        '503':
          $ref: '#/components/responses/CategoryUnavailable'
  /api/v1/categories/recent:
    get:
      operationId: recentCategories
      summary: Get up to ten recently used active categories
      tags:
      - Categories
      security:
      - UserBearer: []
      responses:
        '200':
          description: Recent distinct categories
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentCategories'
        '400':
          $ref: '#/components/responses/CategoryValidationError'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryConflict'
        '503':
          $ref: '#/components/responses/CategoryUnavailable'
      description: Own non-deleted transactions only. Order by maximum transaction createdAt descending, then categoryId
        ascending; occurredOn and edits do not change recency. Archived categories are excluded.
  /api/v1/categories:
    post:
      operationId: createCategory
      summary: Create a custom category
      tags:
      - Categories
      security:
      - UserBearer: []
      responses:
        '201':
          description: Created
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '200':
          description: Normalized replay matches current data; does not restore archived category
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/CategoryValidationError'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryConflict'
        '503':
          $ref: '#/components/responses/CategoryUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      description: clientId is normalized to lowercase. Matching current create fields replays safely; differing fields
        or replay against a system default returns conflict. Parent must belong to owner and all ancestors must be
        active. No category type split; used by both income and expense.
    get:
      operationId: listCategories
      summary: List own categories as a flat tree
      tags:
      - Categories
      security:
      - UserBearer: []
      responses:
        '200':
          description: Page ordered by createdAt ascending, then id ascending
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '400':
          $ref: '#/components/responses/CategoryValidationError'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryConflict'
        '503':
          $ref: '#/components/responses/CategoryUnavailable'
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - active
          - archived
          - all
          default: active
      - in: query
        name: parentId
        required: false
        schema:
          oneOf:
          - type: string
            format: uuid
          - type: string
            const: root
          description: Omit for all levels; root for null parent; UUID for direct children. Foreign/missing parent
            returns 404.
  /api/v1/categories/{id}/usage:
    get:
      operationId: getCategoryUsage
      summary: Count transactions that deleting this category would move
      description: Every transaction of the owner in this category, soft-deleted ones included (the same rows DELETE
        moves to replacementCategoryId). Used by the delete popup (DS-P2-003).
      tags:
      - Categories
      security:
      - UserBearer: []
      responses:
        '200':
          description: Usage
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [transactionCount]
                properties:
                  transactionCount:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/CategoryValidationError'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '503':
          $ref: '#/components/responses/CategoryUnavailable'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/categories/{id}:
    get:
      operationId: getCategory
      summary: Get an own active or archived category
      tags:
      - Categories
      security:
      - UserBearer: []
      responses:
        '200':
          description: Category
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/CategoryValidationError'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryConflict'
        '503':
          $ref: '#/components/responses/CategoryUnavailable'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCategory
      summary: Edit, move, archive or restore a category
      tags:
      - Categories
      security:
      - UserBearer: []
      responses:
        '200':
          description: Updated category
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/CategoryValidationError'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryConflict'
        '503':
          $ref: '#/components/responses/CategoryUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      description: Version required. Omitted fields stay unchanged; null clears parent/color/icon. Reject cycles and
        foreign parents. Archive requires no active direct children. Restoring or moving an active category requires
        all ancestors active. No cascade. System defaults are editable; clientId/isSystem/groupId are not writable.
    delete:
      operationId: deleteCategory
      summary: Move references then permanently delete a childless category
      tags:
      - Categories
      security:
      - UserBearer: []
      responses:
        '204':
          description: Deleted atomically
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/CategoryValidationError'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryConflict'
        '503':
          $ref: '#/components/responses/CategoryUnavailable'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: version
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483646
      - in: query
        name: replacementCategoryId
        required: false
        schema:
          type: string
          format: uuid
      description: Reject any children including archived ones. Replacement required if any transaction references
        this category, including soft-deleted transactions. Target must be a different, active category of the same
        owner. Move all references and increment each transaction version/updatedAt, preserving money, date, account,
        tags and deletedAt. Any failure or version overflow rolls back everything. Empty categories may be deleted
        without replacement. No category restore after deletion.
  /api/v1/feedback:
    post:
      operationId: sendFeedback
      summary: Send feedback from the app
      tags:
      - Feedback
      security:
      - UserBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - kind
              - topic
              - message
              - allowReply
              - appVersion
              properties:
                kind:
                  type: string
                  enum:
                  - bug
                  - idea
                  - praise
                topic:
                  type: string
                  enum:
                  - record
                  - reports
                  - wallets
                  - categories
                  - appearance
                  - other
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
                allowReply:
                  type: boolean
                  description: The user agreed to be answered by email.
                appVersion:
                  type: string
                  pattern: ^[0-9A-Za-z.+_-]{1,30}$
      responses:
        '204':
          description: Stored
        '400':
          description: Invalid body
        '401':
          description: Session missing or expired
        '429':
          description: Five messages an hour per user; Retry-After is 3600
      description: Text only, owned by the user and deleted with the account. Never logged.
  /api/v1/tags:
    post:
      operationId: createTag
      summary: Create a tag owned by the session user
      tags:
      - Tags
      security:
      - UserBearer: []
      responses:
        '201':
          description: Created
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '200':
          description: Normalized clientId replay matches current name
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/TagValidationError'
        '401':
          $ref: '#/components/responses/TagUnauthorized'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '409':
          $ref: '#/components/responses/TagConflict'
        '503':
          $ref: '#/components/responses/TagUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      description: clientId is normalized to lowercase. Matching current name replays safely; a different name for the
        same clientId returns conflict. Duplicate names are allowed. Attach tags to transactions via existing tagIds.
    get:
      operationId: listTags
      summary: List own tags
      tags:
      - Tags
      security:
      - UserBearer: []
      responses:
        '200':
          description: Page ordered by createdAt ascending, then id ascending
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '400':
          $ref: '#/components/responses/TagValidationError'
        '401':
          $ref: '#/components/responses/TagUnauthorized'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '409':
          $ref: '#/components/responses/TagConflict'
        '503':
          $ref: '#/components/responses/TagUnavailable'
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
  /api/v1/tags/{id}:
    get:
      operationId: getTag
      summary: Get an own tag
      tags:
      - Tags
      security:
      - UserBearer: []
      responses:
        '200':
          description: Tag
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/TagValidationError'
        '401':
          $ref: '#/components/responses/TagUnauthorized'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '409':
          $ref: '#/components/responses/TagConflict'
        '503':
          $ref: '#/components/responses/TagUnavailable'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTag
      summary: Rename an own tag
      tags:
      - Tags
      security:
      - UserBearer: []
      responses:
        '200':
          description: Updated
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/TagValidationError'
        '401':
          $ref: '#/components/responses/TagUnauthorized'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '409':
          $ref: '#/components/responses/TagConflict'
        '503':
          $ref: '#/components/responses/TagUnavailable'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
    delete:
      operationId: deleteTag
      summary: Detach from transactions then permanently delete a tag
      tags:
      - Tags
      security:
      - UserBearer: []
      responses:
        '204':
          description: Deleted atomically
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/TagValidationError'
        '401':
          $ref: '#/components/responses/TagUnauthorized'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '409':
          $ref: '#/components/responses/TagConflict'
        '503':
          $ref: '#/components/responses/TagUnavailable'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: version
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483646
      description: Removes TransactionTag links for the owner, increments version/updatedAt on every linked
        transaction including soft-deleted ones, then deletes the tag. Version overflow on a linked transaction
        rolls back. Missing or foreign id returns 404.
  /api/v1/recurring-transactions:
    post:
      operationId: createRecurringTransaction
      summary: Create a recurring income, expense, or transfer rule
      tags:
      - RecurringTransactions
      security:
      - UserBearer: []
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
        description: Must equal body.clientId (case-insensitive).
      responses:
        '201':
          description: Created
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringRule'
        '200':
          description: Matching clientId replay
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringRule'
        '400':
          $ref: '#/components/responses/RecurringValidationError'
        '401':
          $ref: '#/components/responses/RecurringUnauthorized'
        '404':
          $ref: '#/components/responses/RecurringNotFound'
        '409':
          $ref: '#/components/responses/RecurringConflict'
        '503':
          $ref: '#/components/responses/RecurringUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecurringRequest'
      description: Amounts are signed integer minor-unit strings. Monthly/yearly dates clamp to the last day of
        shorter months. Transfers require a counter account and balanced amounts (or fxRate for cross-currency).
    get:
      operationId: listRecurringTransactions
      summary: List own recurring rules
      tags:
      - RecurringTransactions
      security:
      - UserBearer: []
      responses:
        '200':
          description: Page ordered by nextExecutionDate, then createdAt, then id
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringRuleList'
        '400':
          $ref: '#/components/responses/RecurringValidationError'
        '401':
          $ref: '#/components/responses/RecurringUnauthorized'
        '503':
          $ref: '#/components/responses/RecurringUnavailable'
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: active
        required: false
        schema:
          type: boolean
  /api/v1/recurring-transactions/run:
    post:
      operationId: runRecurringTransactions
      summary: Post due occurrences for the session user
      tags:
      - RecurringTransactions
      security:
      - UserBearer: []
      responses:
        '200':
          description: Counts of newly created and skipped (blocked) occurrences
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringRunResult'
        '401':
          $ref: '#/components/responses/RecurringUnauthorized'
        '503':
          $ref: '#/components/responses/RecurringUnavailable'
      description: Uses the profile timezone calendar day. Each due day creates at most one transaction bundle
        via deterministic clientIds; retries and sync replays stay idempotent. Inactive rules are skipped.
        At most 36 catch-up posts per rule per call.
  /api/v1/recurring-transactions/{id}:
    get:
      operationId: getRecurringTransaction
      summary: Get an own recurring rule
      tags:
      - RecurringTransactions
      security:
      - UserBearer: []
      responses:
        '200':
          description: Rule
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringRule'
        '401':
          $ref: '#/components/responses/RecurringUnauthorized'
        '404':
          $ref: '#/components/responses/RecurringNotFound'
        '503':
          $ref: '#/components/responses/RecurringUnavailable'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateRecurringTransaction
      summary: Update an own recurring rule
      tags:
      - RecurringTransactions
      security:
      - UserBearer: []
      responses:
        '200':
          description: Updated
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringRule'
        '400':
          $ref: '#/components/responses/RecurringValidationError'
        '401':
          $ref: '#/components/responses/RecurringUnauthorized'
        '404':
          $ref: '#/components/responses/RecurringNotFound'
        '409':
          $ref: '#/components/responses/RecurringConflict'
        '503':
          $ref: '#/components/responses/RecurringUnavailable'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecurringRequest'
      description: Does not rewrite transactions already posted from the rule. Type and clientId are immutable.
    delete:
      operationId: deleteRecurringTransaction
      summary: Delete an own recurring rule
      tags:
      - RecurringTransactions
      security:
      - UserBearer: []
      responses:
        '204':
          description: Deleted
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/RecurringUnauthorized'
        '404':
          $ref: '#/components/responses/RecurringNotFound'
        '409':
          $ref: '#/components/responses/RecurringConflict'
        '503':
          $ref: '#/components/responses/RecurringUnavailable'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: version
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483646
      description: Posted transactions keep their rows; recurringRuleId is set null.
  /api/v1/budgets/current:
    get:
      operationId: getCurrentBudget
      summary: Current monthly budget with spend against the fiscal month
      tags:
      - Budgets
      security:
      - UserBearer: []
      parameters:
      - in: query
        name: on
        required: false
        schema:
          type: string
          format: date
        description: Calendar day in the profile timezone anchoring the fiscal month. Defaults to today.
      - in: query
        name: applyTo
        required: false
        schema:
          type: string
          enum: [default, month]
        description: When `default`, return the template only (ignore month overrides).
          Omit (or `month`) for the effective budget of the fiscal month.
      responses:
        '200':
          description: Budget summary, or budget null when none is set
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCurrentResponse'
        '400':
          $ref: '#/components/responses/BudgetValidationError'
        '401':
          $ref: '#/components/responses/BudgetUnauthorized'
        '503':
          $ref: '#/components/responses/BudgetUnavailable'
      description: Spent counts only non-deleted expense transactions in the budget currency
        within the fiscal month. Income and transfers are excluded. Category lines include
        descendant spend. Amounts are integer minor-unit strings. When `applyTo` is omitted
        or `month` and a month override exists for the fiscal month of `on`, it is returned
        (`isOverride=true`); otherwise the default template is used if present. `applyTo=default`
        always returns the template so clients can edit every-month limits.
