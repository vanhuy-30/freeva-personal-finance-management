  securitySchemes:
    StaffBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 256-bit token returned once on login; absolute 7-day expiry. Server
        checks session storage on every authenticated request. No refresh token in this
        phase.
  schemas:
    Category:
      type: object
      additionalProperties: false
      required:
      - id
      - clientId
      - name
      - kind
      - parentId
      - colorToken
      - iconToken
      - groupId
      - isSystem
      - archivedAt
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; duplicate names are allowed.
        kind:
          type: string
          enum: [expense, income, both]
          description: Chi / Thu tab. Set on create (default both); a subcategory always has its parent's kind and
            takes the new parent's kind when moved. Not enforced on transaction write in Phase 1.
        parentId:
          type:
          - string
          - 'null'
          format: uuid
        colorToken:
          type:
          - string
          - 'null'
          maxLength: 100
          description: One of GET /categories/options colorTokens (or null), never a hex color. A row that already holds
            another catalog key may keep it unchanged.
        iconToken:
          type:
          - string
          - 'null'
          enum:
          - category
          - food
          - coffee
          - groceries
          - shopping
          - clothes
          - gifts
          - transport
          - bus
          - fuel
          - travel
          - housing
          - repair
          - electricity
          - water
          - internet
          - phone
          - health
          - medicine
          - sports
          - family
          - pets
          - beauty
          - education
          - books
          - music
          - entertainment
          - games
          - salary
          - bonus
          - investment
          - work
          - other_income
          - bills
          - insurance
          - subscription
          - other_expense
          - null
        groupId:
          type:
          - string
          - 'null'
          format: uuid
        isSystem:
          type: boolean
          description: Server-managed origin metadata; defaults remain editable.
        archivedAt:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
