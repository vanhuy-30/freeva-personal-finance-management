                type: string
                pattern: ^-?[0-9]+$
              expenseMinor:
                type: string
                pattern: ^-?[0-9]+$
                description: Signed (negative or zero).
              transferInMinor:
                type: string
                pattern: ^-?[0-9]+$
                description: Sum of matching transfer legs that add money (positive or zero). With one `accountId`, the money moved into that wallet.
              transferOutMinor:
                type: string
                pattern: ^-?[0-9]+$
                description: Sum of matching transfer legs that take money (negative or zero). With one `accountId`, the money moved out of that wallet.
