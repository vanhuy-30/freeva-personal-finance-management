            $ref: '#/components/schemas/CashflowAccountTotal'
        comparison:
          $ref: '#/components/schemas/CashflowComparison'
        topMerchants:
          type: array
          description: Up to 10 expense merchants per currency in the requested period, sorted by |expense| descending then merchant name.
          items:
            $ref: '#/components/schemas/CashflowMerchantTotal'
    TrendReport:
      type: object
      additionalProperties: false
