      - crossedThresholds
      - categories
      - period
      - applyTo
      - isOverride
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        currencyCode:
          type: string
          pattern: ^[A-Z]{3}$
        limitMinor:
          $ref: '#/components/schemas/ReportMoney'
        spentMinor:
          $ref: '#/components/schemas/ReportMoney'
        remainingMinor:
          $ref: '#/components/schemas/ReportMoney'
        percentBps:
          type: integer
          description: spent * 10000 / limit (7000 = 70.00%).
        status:
          $ref: '#/components/schemas/BudgetStatus'
        alertThresholds:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: integer
            minimum: 1
            maximum: 100
        crossedThresholds:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 100
          description: Alert thresholds already reached for overall spend.
        categories:
          type: array
          items:
            $ref: '#/components/schemas/BudgetCategoryProgress'
        period:
