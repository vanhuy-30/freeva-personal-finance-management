  /api/v1/sync:
    post:
      operationId: syncTransactions
      summary: Apply a transaction mutation queue
      description: Bearer session owner. schemaVersion must equal SchemaMeta.version. Each operation commits on its own. Create idempotency is legs[0].clientId; there is no Idempotency-Key header. A matching replay is replayed. A conflicting clientId or stale version is conflict and does not overwrite. review is true only when a requested amount differs from the stored amount. A newly created transaction may include up to five duplicate hints for another active transaction with the same owner, account, amountMinor and occurredOn created within the previous 10 minutes. Hints do not drop the create. Per-item failures stay in the 200 body. Later operations still run after conflict or rejection. An unexpected failure rejects that item and omits the rest.
      tags:
      - Sync
      security:
      - UserBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Queue accepted. Individual operations may be applied, replayed, conflict or rejected (a category whose kind does not fit the type is rejected with error.code CATEGORY_KIND_MISMATCH).
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          description: VALIDATION_ERROR before any write
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: SESSION_INVALID or auth error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: SYNC_SCHEMA_MISMATCH before any write
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: SYNC_UNAVAILABLE when SchemaMeta is missing or sync storage fails
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/reports/cashflow:
    get:
      operationId: reportCashflow
      summary: Report income, expense, and net cashflow for a period
      tags:
      - Reports
      security:
      - UserBearer: []
      parameters:
      - name: period
        in: query
        required: true
        schema:
          type: string
          enum:
          - week
          - month
          - year
          - range
      - name: on
        in: query
        required: false
        schema:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        description: Anchor calendar date for week, month, or year. Defaults to today in the user timezone. Forbidden for range.
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        description: Inclusive range start. Required with to for period=range. Forbidden for week, month, and year.
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        description: Inclusive range end. At most 3660 days after from.
      responses:
        '200':
          description: Period totals by currency, leaf category, and account
          headers:
            Cache-Control:
              $ref: '#/components/headers/ReportNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashflowReport'
        '400':
          $ref: '#/components/responses/ReportValidationError'
        '401':
          $ref: '#/components/responses/ReportUnauthorized'
        '503':
          $ref: '#/components/responses/ReportUnavailable'
      description: Read-only. Week is Monday through Sunday. Month follows fiscalMonthStartDay in the user timezone. Year is the calendar year (01-01 to 12-31). Amounts stay in each account currency; transfers are excluded from income, expense, and net. Savings equals netMinor; savingsRateBps is net/income in basis points when income is positive. comparison is the adjacent previous period of the same kind (range shifts back by its inclusive length). topMerchants lists up to 10 expense merchants per currency for the requested period. No FX conversion.
  /api/v1/reports/trend:
    get:
      operationId: reportTrend
      summary: Report expense and income per bucket for the trend chart
      tags:
      - Reports
      security:
      - UserBearer: []
      parameters:
      - name: period
        in: query
        required: true
        schema:
          type: string
          enum:
          - week
          - month
          - year
      - name: on
        in: query
        required: false
        schema:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        description: Anchor calendar date of the last bucket. Defaults to today in the user timezone.
      responses:
        '200':
          description: Oldest-first buckets ending at the period that contains the anchor
          headers:
            Cache-Control:
              $ref: '#/components/headers/ReportNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendReport'
        '400':
          $ref: '#/components/responses/ReportValidationError'
        '401':
          $ref: '#/components/responses/ReportUnauthorized'
        '503':
          $ref: '#/components/responses/ReportUnavailable'
      description: Read-only, one call for the whole chart. Week returns 8 Monday weeks, month 6 months following fiscalMonthStartDay, year up to 5 calendar years (years before the first transaction are dropped, the current year is always kept). Amounts stay in each account currency; transfers are excluded. No FX conversion.
  /api/v1/reports/series:
    get:
      operationId: reportSeries
      summary: Report income and expense series for a time window
      tags:
      - Reports
      security:
      - UserBearer: []
      parameters:
      - name: window
        in: query
        required: true
        schema:
          type: string
          enum:
          - 7d
          - 30d
          - 3m
          - 6m
          - 1y
          - all
      - name: on
        in: query
        required: false
        schema:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        description: Anchor calendar date of the last bucket. Defaults to today in the user timezone.
      responses:
        '200':
          description: Oldest-first buckets ending at the period that contains the anchor
          headers:
            Cache-Control:
              $ref: '#/components/headers/ReportNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesReport'
        '400':
          $ref: '#/components/responses/ReportValidationError'
        '401':
          $ref: '#/components/responses/ReportUnauthorized'
        '503':
          $ref: '#/components/responses/ReportUnavailable'
      description: Read-only income and expense series. 7d and 30d are single calendar days. 3m, 6m, and 1y are 3, 6, and 12 fiscal months. all is each calendar year from the first income or expense through the anchor year (current year always kept; history stops at year 100). Amounts stay in each account currency; transfers are excluded. No FX conversion.
  /api/v1/reports/month-review:
    get:
      operationId: reportMonthReview
      summary: Monthly financial review for one fiscal month
      tags:
      - Reports
      security:
      - UserBearer: []
      parameters:
      - name: on
        in: query
        required: false
        schema:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        description: Anchor calendar date of the fiscal month. Defaults to today in the user timezone.
      responses:
