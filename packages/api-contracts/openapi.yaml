          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'TRANSACTION_CONFLICT: stale version, archived wallet, or conflicting clientId replay'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: TRANSACTIONS_UNAVAILABLE
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Private financial data must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
