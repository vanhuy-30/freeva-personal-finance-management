openapi: 3.1.0
info:
  title: Freeva API
  version: 0.1.0
  description: Source of truth for mobile and web admin.
servers:
  - url: http://localhost:4000
    description: local
paths:
  /api/v1/auth/oauth/challenges:
    post:
      summary: Create a provider-bound OAuth challenge
      operationId: createOAuthChallenge
      tags: [Auth]
      security: []
      description: Create a single-use 5-minute challenge. Send nonce unchanged to the provider; keep challengeToken locally until exchange.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthChallengeRequest'
      responses:
        '200':
          description: Success (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthChallengeResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid credentials or challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many attempts; 30 requests per IP per operation in 15 minutes
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Provider disabled or authentication unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/oauth/login:
    post:
      summary: Exchange a provider ID token for a Freeva session
      operationId: loginOAuth
      tags: [Auth]
      security: []
      description: Verify a Google or Apple ID token bound to the server nonce and issue an opaque 7-day session. Identity is provider plus subject. Never auto-link by email; conflicting email or missing verified email for a new identity returns generic 401. Existing identities need no email claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginRequest'
      responses:
        '200':
          description: Success (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid credentials or challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many attempts; 30 requests per IP per operation in 15 minutes
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Provider disabled or authentication unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/profile:
    get:
      operationId: getProfile
      tags: [Profile]
      security:
        - UserBearer: []
      responses:
        '200':
          description: Current profile data (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: updateProfile
      tags: [Profile]
      security:
        - UserBearer: []
      description: Update own preferences with optimistic version check. Does not convert existing monetary data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: Current profile data (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Profile changed; reload before saving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/profile/options:
    get:
      operationId: getProfileOptions
      tags: [Profile]
      security:
        - UserBearer: []
      responses:
        '200':
          description: Current profile data (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOptions'
        '401':
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/health:
    get:
      security: []
      operationId: getHealth
      tags: [Health]
      summary: Liveness and database check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/user-lookups:
    post:
      operationId: lookupUserAccountForStaff
      tags: [Admin]
      summary: Look up one user account by exact ID or email
      description: Staff-only lookup. Every completed lookup attempt is audited before PII is returned.
      security:
        - StaffBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserLookupRequest'
      responses:
        '200':
          description: Minimum account profile for support lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUserLookupResponse'
        '400':
          description: Invalid or ambiguous lookup criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid staff credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No user matches the exact lookup criterion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Staff auth or audit storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/email-step:
    post:
      operationId: emailStep
      tags:
      - Auth
      summary: Choose login or registration for the email-first mobile flow
      description: Intentionally reveals whether an email is registered. Returns only
        the next step, including login for legacy accounts without a password.
        Rate limited per IP/email; no account details and no credential mutation.
      security: []
      responses:
        '200':
          description: Next step; response must not be cached
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEmailStepResponse'
        '400':
          description: Invalid email or request body. Validation errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailRequest'
  /api/v1/auth/register:
    post:
      operationId: register
      tags:
      - Auth
      summary: Register email/password; duplicate email returns the same response without
        changing credentials
      security: []
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthAccepted'
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentialsRequest'
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Login with email and password; email verification is optional
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing/expired/revoked session, or incorrect credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentialsRequest'
  /api/v1/auth/email-verifications:
    post:
      operationId: requestEmailVerification
      tags:
      - Auth
      summary: Request/retry verification email (24-hour single-use token); replaces
        previous token
      security: []
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthAccepted'
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailRequest'
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags:
      - Auth
      summary: Consume email verification token; does not create a session
      security: []
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
  /api/v1/auth/password-resets:
    post:
      operationId: requestPasswordReset
      tags:
      - Auth
      summary: Request reset email (30-minute single-use token); same response for unknown
        accounts
      security: []
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthAccepted'
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailRequest'
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags:
      - Auth
      summary: Reset password and atomically revoke all sessions and outstanding email
        tokens; does not verify email or auto-login
      security: []
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResetPasswordRequest'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: Revoke current session
      security:
      - UserBearer: []
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing/expired/revoked session, or incorrect credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached: 30 attempts per source IP and operation,
            5 per normalized email and operation, per 15-minute fixed window. Includes
            successful attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until the limiting window expires.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sessions:
    get:
      operationId: listSessions
      tags:
      - Auth
      summary: List own active sessions, newest first
      security:
      - UserBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionsResponse'
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing/expired/revoked session, or incorrect credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: revokeAllSessions
      tags:
      - Auth
      summary: Revoke all own sessions, including current session
      security:
      - UserBearer: []
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing/expired/revoked session, or incorrect credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags:
      - Auth
      summary: Revoke own session; idempotent 204 also for missing or foreign session
        IDs
      security:
      - UserBearer: []
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request or invalid/expired/consumed email token. Validation
            errors never echo submitted values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing/expired/revoked session, or incorrect credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Authentication storage temporarily unavailable; fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
          description: UUID v4
components:
  securitySchemes:
    StaffBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 256-bit token returned once on login; absolute 7-day expiry. Server
        checks session storage on every authenticated request. No refresh token in this
        phase.
  schemas:
    OAuthChallengeRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          enum: [google, apple]
    OAuthChallengeResponse:
      type: object
      additionalProperties: false
      required: [challengeToken, nonce, expiresAt]
      properties:
        challengeToken:
          type: string
          pattern: ^[a-f0-9]{64}$
        nonce:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 of challengeToken; pass unchanged as the provider nonce. SDKs that hash a raw nonce must receive challengeToken instead.
        expiresAt:
          type: string
          format: date-time
    OAuthLoginRequest:
      type: object
      additionalProperties: false
      required: [provider, challengeToken, idToken]
      properties:
        provider:
          type: string
          enum: [google, apple]
        challengeToken:
          type: string
          pattern: ^[a-f0-9]{64}$
        idToken:
          type: string
          minLength: 1
          maxLength: 16384
    Profile:
      type: object
      additionalProperties: false
      required: [locale, defaultCurrencyCode, timezone, fiscalMonthStartDay, version]
      properties:
        locale:
          type: string
          enum: [vi, en]
        defaultCurrencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Must exist in the currency catalog.
        timezone:
          type: string
          maxLength: 100
          description: IANA timezone or UTC; aliases accepted.
          example: Asia/Ho_Chi_Minh
        fiscalMonthStartDay:
          type: integer
          minimum: 1
          maximum: 28
        version:
          type: integer
          minimum: 1
          maximum: 2147483646
    ProfileOptions:
      type: object
      additionalProperties: false
      required: [currencies, timezones]
      properties:
        currencies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, minorDigits]
            properties:
              code:
                type: string
                pattern: '^[A-Z]{3}$'
              minorDigits:
                type: integer
                minimum: 0
        timezones:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: freeva-api
        timestamp:
          type: string
          format: date-time
        database:
          type: string
          enum: [up, down]
    StaffUserLookupRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [userId]
          properties:
            userId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required: [email]
          properties:
            email:
              type: string
              format: email
    StaffUserLookupResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - locale
        - timezone
        - defaultCurrencyCode
        - fiscalMonthStartDay
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        locale:
          type: string
          example: vi
        timezone:
          type: string
          example: Asia/Ho_Chi_Minh
        defaultCurrencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: VND
        fiscalMonthStartDay:
          type: integer
          minimum: 1
          maximum: 28
        createdAt:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
    AuthEmailRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email: &id001
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased before lookup/storage.
    AuthEmailStepResponse:
      type: object
      additionalProperties: false
      required:
      - nextStep
      properties:
        nextStep:
          type: string
          enum:
          - login
          - register
    AuthCredentialsRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email: *id001
        password: &id003
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Not trimmed or normalized.
    AuthTokenRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token: &id002
          type: string
          pattern: ^[a-f0-9]{64}$
          writeOnly: true
    AuthResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - token
      - password
      properties:
        token: *id002
        password: *id003
    AuthAccepted:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          const: If the account is eligible, an email will be sent.
    AuthLoginResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - expiresAt
      - sessionId
      properties:
        accessToken:
          type: string
          pattern: ^[a-f0-9]{64}$
        tokenType:
          type: string
          enum:
          - Bearer
        expiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
    AuthSession:
      type: object
      additionalProperties: false
      required:
      - id
      - createdAt
      - expiresAt
      - current
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
    AuthSessionsResponse:
      type: object
      additionalProperties: false
      required:
      - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AuthSession'
