<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv11" 1}
a,button,textarea{font-family:inherit}
.tc{height:56px;border-radius:18px;border:1px solid #E4E7F0;background:#FFFFFF;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:14px;font-weight:600;color:#22283A;text-decoration:none;box-sizing:border-box;position:relative}
.tc.on{background:#EEF2FD;border:1.5px solid #3F67D1}
.wi{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.lb{font-size:13px;font-weight:600;color:#5C6378;padding-left:4px}
.ch{height:36px;padding:0 14px;border-radius:999px;border:1px solid #E4E7F0;background:#FFFFFF;color:#22283A;font-size:13px;font-weight:500;white-space:nowrap}
.ch.on{border:1.5px solid #22283A;font-weight:600}
.th{width:56px;height:72px;border-radius:12px;background:#EEF0F5;position:relative;overflow:hidden;flex:0 0 56px}
.x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:999px;border:none;background:rgba(34,40,58,.7);color:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:0}
.sw{width:48px;height:28px;border-radius:999px;border:none;padding:3px;display:flex;flex:0 0 48px}
.kn{width:22px;height:22px;border-radius:999px;background:#FFFFFF;box-shadow:0 1px 3px rgba(34,40,58,.25)}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FCFDFF; color: #22283A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 28px 20px; gap: 14px">

    <a href="#" role="radio" aria-checked="true" class="tc on"><span class="wi" style="background: #FFFFFF; color: #7A5A00"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"></path></svg></span>Ý tưởng</a>

  </div>

  <span class="lb">Về phần nào?</span>
  <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: -6px">
    <button class="ch on" aria-pressed="true">Ghi chi</button>
    <button class="ch">Báo cáo</button>
    <button class="ch">Ví</button>
    <button class="ch">Danh mục</button>
    <button class="ch">Giao diện</button>
    <button class="ch">Khác</button>
  </div>

  <div style="border-radius: 16px; border: 1.5px solid #3F67D1; box-shadow: 0 0 0 4px rgba(86,128,233,.18); background: #FFFFFF; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px">

    <textarea id="fb" rows="3" style="border: none; outline: none; background: transparent; font-size: 16px; line-height: 22px; color: #22283A; padding: 0; resize: none">Mong có nhắc ghi chi vào buổi tối, để cuối ngày không quên.</textarea>
    <span class="num" style="align-self: flex-end; font-size: 12px; color: #6B7288">62/2000</span>
  </div>

  <div style="display: flex; align-items: center; gap: 8px">
    <span class="th" aria-label="Ảnh chụp màn hình 1"><span style="position: absolute; left: 6px; right: 6px; top: 8px; height: 10px; border-radius: 3px; background: #DDE6FB"></span><span style="position: absolute; left: 6px; right: 14px; top: 24px; height: 6px; border-radius: 3px; background: #D5DAEA"></span><span style="position: absolute; left: 6px; right: 20px; top: 34px; height: 6px; border-radius: 3px; background: #D5DAEA"></span><button class="x" aria-label="Bỏ ảnh 1"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>
    <button aria-label="Thêm ảnh chụp màn hình" style="width: 56px; height: 72px; border-radius: 12px; border: 1.5px dashed #C9CEDD; background: transparent; color: #5C6378; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    <span style="font-size: 13px; color: #5C6378; padding-left: 4px">Thêm ảnh chụp màn hình</span>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 16px; padding: 10px 14px; box-shadow: 0 1px 2px rgba(34,40,58,.04), 0 6px 18px rgba(34,40,58,.05)">
    <span style="flex-grow: 1; font-size: 15px">Trả lời tôi qua email</span>
    <button role="switch" aria-checked="true" aria-label="Trả lời tôi qua email" class="sw" style="background: #3F67D1; justify-content: flex-end"><span class="kn"></span></button>
  </div>

  <a href="MeFeedbackSent.dc.html" style="margin-top: auto; height: 56px; border-radius: 999px; background: #3F67D1; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Gửi góp ý</a>
</div>
