name: mobile
description: Freeva personal finance — Flutter iOS + Android
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ^3.13.0
  flutter: 3.47.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^8.0.3
  injectable: ^2.5.0
  go_router: ^14.6.2
  logger: ^2.5.0
  intl: any
  dartz: ^0.10.1
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  timezone: ^0.10.1
  flutter_local_notifications: ^20.1.0
  sentry_flutter: ^9.30.1
  lucide_icons_flutter: 4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/freeva-brand-symbol.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    # Lucide at the canvas stroke (1.75); built by tool/lucide_stroke.
    - family: Lucide175
      fonts:
        - asset: assets/fonts/Lucide175.ttf
